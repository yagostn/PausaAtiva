name: Sem atribuição a ferramentas de IA

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir título, descrição e commits do PR
        env:
          TITULO: ${{ github.event.pull_request.title }}
          DESCRICAO: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          padrao=.githooks/padrao-atribuicao.txt
          falhou=0

          if printf '%s\n%s\n' "$TITULO" "$DESCRICAO" | grep -niEf "$padrao"; then
            echo "::error::O título ou a descrição do PR cita uma ferramenta de IA ou agente."
            falhou=1
          fi

          for sha in $(git rev-list "$BASE..$HEAD"); do
            if git log -1 --format=%B "$sha" | grep -niEf "$padrao"; then
              echo "::error::O commit $sha cita uma ferramenta de IA ou agente."
              falhou=1
            fi
          done

          if [ "$falhou" -ne 0 ]; then
            echo "Tire a atribuição. A regra está no AGENTS.md."
            exit 1
          fi
